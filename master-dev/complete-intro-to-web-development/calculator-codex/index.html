<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="calculator.js" defer></script>
  </head>
  <body>
    <main class="page-shell" aria-label="Calculator demo">
      <section class="calculator" aria-label="Basic calculator">
        <output class="calculator__display" id="calculator-display" aria-live="polite">0</output>

        <div class="calculator__keys" aria-label="Calculator controls">
          <button class="key key--utility key--span-2" type="button" data-action="clear">C</button>
          <button class="key key--utility" type="button" data-action="backspace" aria-label="Delete last digit">&larr;</button>
          <button class="key key--operator" type="button" data-action="operator" data-operator="divide" aria-label="Divide">&divide;</button>

          <button class="key" type="button" data-action="digit" data-value="7">7</button>
          <button class="key" type="button" data-action="digit" data-value="8">8</button>
          <button class="key" type="button" data-action="digit" data-value="9">9</button>
          <button class="key key--operator" type="button" data-action="operator" data-operator="multiply" aria-label="Multiply">&times;</button>

          <button class="key" type="button" data-action="digit" data-value="4">4</button>
          <button class="key" type="button" data-action="digit" data-value="5">5</button>
          <button class="key" type="button" data-action="digit" data-value="6">6</button>
          <button class="key key--operator" type="button" data-action="operator" data-operator="subtract" aria-label="Subtract">&minus;</button>

          <button class="key" type="button" data-action="digit" data-value="1">1</button>
          <button class="key" type="button" data-action="digit" data-value="2">2</button>
          <button class="key" type="button" data-action="digit" data-value="3">3</button>
          <button class="key key--operator" type="button" data-action="operator" data-operator="add" aria-label="Add">+</button>

          <button class="key key--span-3" type="button" data-action="digit" data-value="0">0</button>
          <button class="key key--operator" type="button" data-action="equals" aria-label="Equals">=</button>
        </div>
      </section>
    </main>
  </body>
</html>
